:hover{background:#078d88}.section{margin-top:33px}.section h2{font-size:23px;line-height:1.25;letter-spacing:-.5px;margin:0 0 9px}.sub{color:var(--muted);margin:0 0 19px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.cards.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--surface);padding:23px;border:1px solid var(--line);border-radius:15px;box-shadow:0 4px 18px #183c5108}.card h3{font-size:18px;line-height:1.35;margin:5px 0 9px}.card p{color:#536a78;margin:7px 0 13px}.eyebrow{font-size:11px;letter-spacing:1.1px;font-weight:800;text-transform:uppercase;color:var(--teal)}.metric{font-size:34px;line-height:1.2;font-weight:800;color:#163f50}.link{font-weight:700;font-size:13px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.filters input,.filters select{background:#fff;border:1px solid #d4e1e8;padding:11px 14px;border-radius:10px;max-width:100%;color:var(--ink)}.filters input{flex:1;min-width:210px}.pill{display:inline-block;background:#e8f5f2;color:#187f77;padding:4px 9px;border-radius:20px;font-size:11px;font-weight:700;margin:4px 0}.alert{border-left:4px solid #e3a347;background:var(--warm);padding:14px 17px;border-radius:8px;color:#73572c;margin:15px 0}.small{font-size:12px;color:var(--muted)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:15px}.ghost{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;color:var(--ink);font-size:13px}.ghost:hover{background:#edf7f7}.before{border-top:1px solid var(--line);padding:12px 0}.before strong{font-size:12px;color:var(--teal)}.casegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.table{width:100%;border-collapse:collapse}.table td,.table th{border-bottom:1px solid var(--line);padding:11px;text-align:left}.table th{font-size:12px;color:var(--muted)}.bar{height:14px;background:#e8f0f2;border-radius:15px;overflow:hidden;margin:7px 0}.bar span{display:block;background:# </style></head>
<body><div class="app"><aside class="side"><div class="logo">healthscope<span>.</span></div><small>INTELLIGENCE STUDIO</small><nav id="navigation"></nav><div class="sidefoot">Source-first. Evidence-aware.<br>Built for healthcare analysts.</div></aside><main class="main"><div class="top"><span class="tag">Global Healthcare Intelligence & Learning</span><span class="status" id="freshness">Checking feed…</span></div><div id="content"></div><footer>HealthScope MVP · Educational information only · No patient data · Always verify original sources before using claims in health decisions.</footer></main></div>
<script>
const pages=[["overview","⌂ Overview"],["updates","◈ Global updates"],["dictionary","▤ Healthcare dictionary"],["countries","◫ Country case studies"],["lab","▥ BI analyst lab"],["roadmap","◎ Learning roadmap"],["sources","✳ Sources & methods"]];
const terms=[
["Health information system (HIS)","People, processes, technologies and policies used to collect and use health information.","A national HIS connects reports, registries and decisions.","Health systems"],
["Electronic health record (EHR)","A digital longitudinal record of a person's health information.","A referral physician reviews a previous diagnosis.","Digital health"],
["Interoperability","Different information systems exchanging and using data meaningfully.","A laboratory sends standardized results to an EHR.","Digital health"],
["HL7 FHIR","An international standard for representing and exchanging health information.","A FHIR Observation represents a laboratory measurement.","Digital health"],
["DHIS2","A software platform used to manage and analyze health programme data.","A district reviews monthly vaccination reports.","Digital health"],
["Health information exchange (HIE)","Infrastructure for sharing health information securely between organizations.","A referral hospital accesses available records.","Digital health"],
["Data quality","The fitness of data for a specific purpose.","Duplicate patients can inflate a disease count.","Data quality"],
["Completeness","The share of expected information that is present.","98 of 100 required reports arrived: 98%.","Data quality"],
["Timeliness","Whether data arrives in time for a decision.","An outbreak alert arriving weeks late may be less useful.","Data quality"],
["Validity","Whether records satisfy defined rules and meanings.","An age of 450 years fails a validation check.","Data quality"],
["Accuracy","How closely recorded information reflects reality.","A test result is entered correctly from its source.","Data quality"],
["Data lineage","Where data came from and how it was transformed.","A dashboard KPI can be traced to source records.","Data quality"],
["Numerator","The count on top of a ratio or proportion.","Children vaccinated with a target dose.","Analytics"],
["Denominator","The population or total used as the base for a rate.","Eligible children in a vaccination programme.","Analytics"],
["Incidence","New cases of a disease in a population during a defined period.","New malaria cases during October.","Epidemiology"],
["Prevalence","Existing cases or proportion of people with a condition at a point or over a period.","Adults living with diabetes in a survey.","Epidemiology"],
["Surveillance","Continuous systematic collection, analysis and use of health data for action.","Weekly monitoring of suspected measles.","Public health"],
["Zero-dose child","A child who has received no routine vaccine doses, commonly tracked through DTP1.","Community workers identify children missing first vaccinations.","Public health"],
["Cohort","A group sharing a defined characteristic or start point.","Children born in 2025.","Analytics"],
["Stratification","Examining data separately for meaningful subgroups.","Vaccination coverage by district and age.","Analytics"],
["KPI","A key performance indicator linked to an operational objective.","Monthly stockout rate at health facilities.","BI development"],
["Dashboard","A visual interface displaying indicators for decisions.","A health manager sees facility trends and alerts.","BI development"],
["ETL","Extract, Transform, Load: a common process for preparing analytical data.","Combine and clean monthly hospital records.","BI development"],
["Data warehouse","An organized repository integrating data for reporting and analysis.","A hospital network combines facility KPIs.","BI development"],
["Sensitivity","The share of people with a condition testing positive.","High sensitivity reduces false negatives.","Statistics"],
["Specificity","The share without a condition testing negative.","High specificity reduces false positives.","Statistics"],
["Confidence interval","A sample-based interval expressing statistical uncertainty.","A 95% interval around estimated coverage.","Statistics"],
["Confounding","A third factor that can distort an observed association.","Age influences both treatment selection and outcome.","Research"],
["Randomized controlled trial (RCT)","A study that randomly assigns eligible participants to interventions.","Compare treatments under a protocol.","Research"],
["Case fatality ratio","Deaths among identified cases of a condition during a specified period.","20 deaths among 1,000 identified cases is 2%.","Epidemiology"]];
const countries=[
{country:"Rwanda",theme:"Health system integration",old:"Existing systems such as DHIS2, OpenMRS and laboratory platforms did not always exchange data automatically; some reporting required manual re-entry.",now:"Health information exchange components and a national Health Intelligence Center aim to combine, validate and present health information.",evidence:"A documented interoperability project reduced manual re-entry for selected surveillance workflows. The broader center launched in 2025; full nationwide outcome effects are not yet established.",metric:"Reporting lag · duplicate rate · data reconciliation errors",url:"https://www.afro.who.int/countries/rwanda"},
{country:"Kenya",theme:"Continuity of patient records",old:"Different hospitals and health programmes could hold disconnected records of the same patient.",now:"A National Shared Health Record and Health Information Exchange use interoperability standards including HL7 FHIR.",evidence:"The Ministry of Health reports significant facility digitization and device deployment, but interoperability and rollout remain incomplete.",metric:"Connected facility share · accessible prior records · duplicate tests",url:"https://dha.go.ke/"},
{country:"Nigeria · Bauchi",theme:"Reaching missed children",old:"Routine facility reporting could miss children outside formal services, including zero-dose children.",now:"Community enumeration, household registers, record reconciliation and targeted vaccination outreach.",evidence:"Local projects documented previously missed settlements and children reached. These are programme outputs, not proof of mortality reductions.",metric:"Zero-dose children reached · register completeness · defaulter follow-up",url:"https://www.afro.who.int/countries/nigeria"},
{country:"South Africa",theme:"AI-assisted radiology triage",old:"Urgent medical images could enter busy radiology queues alongside less critical examinations.",now:"Some private radiology services use AI to flag potentially urgent CT findings for prioritized expert review.",evidence:"A vendor reports clinician use and satisfaction at one private practice; independent nationwide outcome evidence is not established.",metric:"Time to urgent review · false alerts · report turnaround",url:"https://www.aidoc.com/"}
];
const steps=[["Week 1","Learn healthcare systems: EHR, HIS, DHIS2, interoperability and FHIR."],["Week 2","Practice data-quality checks and explain incidence, prevalence and vaccination coverage."],["Week 3","Build a Power BI dashboard from a synthetic clinic dataset; define robust denominators."],["Week 4","Write an evidence-aware before/after case study and present your KPIs."]];
const sources=[["World Health Organization","Official global public health announcements","https://www.who.int/news"],["WHO Regional Office for Africa","Africa health systems and programmes","https://www.afro.who.int/news"],["PubMed","Research citations; read original study methods","https://pubmed.ncbi.nlm.nih.gov/"],["ClinicalTrials.gov","Clinical trial registrations and updates","https://clinicaltrials.gov/"]];
const seed=[{id:"who-africa-his",title:"New WHO report reveals critical gaps in Africa's health information systems",source:"WHO Regional Office for Africa",source_type:"Official announcement",published:"2026-11-10",url:"https://www.afro.who.int/news/new-who-report-reveals-critical-gaps-africas-health-information-systems",category:"Digital health",region:"Africa",summary:"WHO assessed health information systems in 40 African countries, including facility-level capacity to analyze and assess the quality of health data."}];
const state={page:"overview",items:seed,query:"",category:"All topics",region:"All regions",dict:"",group:"All topics",lab:"All facilities",metric:"coverage"};
const getLocal=(k,fallback)=>{try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}};
let saved=getLocal("healthscope_saved",[]),done=getLocal("healthscope_done",[]);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const link=(url,label="Read original source")=>'<a class="link" target="_blank" rel="noopener noreferrer" href="'+esc(url)+'">'+esc(label)+' ↗</a>';
const header=(eyebrow,title,desc)=>'<div class="section"><span class="tag">'+eyebrow+'</span><h1 style="font-size:36px;line-height:1.2;letter-spacing:-1px;margin:10px 0">'+title+'</h1><p class="sub">'+desc+'</p></div>';
function article(r){let active=saved.includes(r.id);return '<article class="card"><span class="pill">'+esc(r.category||"Other")+'</span><h3>'+esc(r.title)+'</h3><p class="small">'+esc(r.source)+' · '+esc(r.published||"Date unspecified")+' · '+esc(r.region||"Unspecified region")+'</p><p>'+esc(r.summary||"Read the source for full context.")+'</p><div class="alert" style="font-size:12px">Analyst question: What changed, what evidence supports it, and which indicator could measure impact?</div><div class="actions">'+link(r.url)+'<button class="ghost" data-save="'+esc(r.id)+'">'+(active?"★ Saved":"☆ Save")+'</button></div></article>'}
function overview(){let newItems=[...state.items].sort((a,b)=>String(b.published||"").localeCompare(a.published||"")).slice(0,3);return '<div class="hero"><span class="tag">Your daily intelligence workspace</span><h1>Understand healthcare.<br>Build analytical judgment.</h1><p>Explore verified sources, learn the language of healthcare, compare national innovations and practice evidence-based business intelligence.</p><button class="primary" data-page="updates">Explore today’s updates →</button></div><section class="section"><h2>Today’s learning dashboard</h2><p class="sub">Your daily progress starts with credible information and sharper questions.</p><div class="cards"><div class="card"><div class="eyebrow">Source records</div><div class="metric">'+state.items.length+'</div><p>Source-linked items in the current feed</p></div><div class="card"><div class="eyebrow">Vocabulary</div><div class="metric">'+terms.length+'</div><p>Essential concepts to master</p></div><div class="card"><div class="eyebrow">Roadmap</div><div class="metric">'+done.length+'/4</div><p>Weekly learning milestones completed</p></div></div></section><section class="section"><h2>Recently published</h2><p class="sub">Original dates and evidence types are shown on each card.</p><div class="cards">'+newItems.map(article).join("")+'</div></section><section class="section"><div class="alert"><strong>Your daily 20-minute routine:</strong> Read one source (7 min); learn two terms (5 min); identify one data quality question (5 min); record a BI metric (3 min).</div></section>'}
function updates(){let categories=["All topics",...new Set(state.items.map(r=>r.category||"Other"))];let regions=["All regions",...new Set(state.items.map(r=>r.region||"Unspecified"))];const sel=(options,value,id)=>'<select id="'+id+'">'+options.map(x=>'<option '+(x===value?"selected":"")+'>'+esc(x)+'</option>').join("")+'</select>';let items=state.items.filter(r=>(state.category==="All topics"||r.category===state.category)&&(state.region==="All regions"||r.region===state.region)&&[r.title,r.summary,r.source].join(" ").toLowerCase().includes(state.query.toLowerCase())).sort((a,b)=>String(b.published||"").localeCompare(a.published||""));return header("Global intelligence","Explore healthcare developments","Trace every item back to an original publication. The number of records depends on source availability, not the number of events worldwide.")+'<div class="filters"><input id="searchNews" placeholder="Search technology, country, research…" value="'+esc(state.query)+'">'+sel(categories,state.category,"category")+sel(regions,state.region,"region")+'</div><p class="small">'+items.length+' matching source records</p><div class="cards">'+(items.map(article).join("")||'<div class="card">No matching items. Try another filter.</div>')+'</div>'}
function dictionary(){let cats=["All topics",...new Set(terms.map(x=>x[3]))];let filtered=terms.filter(x=>(state.group==="All topics"||x[3]===state.group)&&x.join(" ").toLowerCase().includes(state.dict.toLowerCase()));return header("Build the language","Healthcare dictionary","Learn the vocabulary behind healthcare systems, epidemiology, research and BI development.")+'<div class="filters"><input id="searchDict" placeholder="Find a term, such as FHIR or denominator…" value="'+esc(state.dict)+'"><select id="dictGroup">'+cats.map(c=>'<option '+(c===state.group?"selected":"")+'>'+esc(c)+'</option>').join("")+'</select></div><p class="small">'+filtered.length+' terms</p><div class="cards">'+filtered.map(t=>'<article class="card"><span class="pill">'+esc(t[3])+'</span><h3>'+esc(t[0])+'</h3><p>'+esc(t[1])+'</p><div class="alert" style="font-size:13px"><strong>Example:</strong> '+esc(t[2])+'</div></article>').join("")+'</div><section class="section"><div class="card quiz" id="quiz"><h2>Quick knowledge check</h2><p>What is the denominator in a vaccination coverage calculation?</p><button data-answer="0">The number of vaccines ordered</button><button data-answer="1">The eligible population for the same dose and period</button><button data-answer="2">The number of clinics</button><p id="quizResponse" class="small"></p></div></section>'}
function countryView(){return header("Healthcare transformations","Before and after","Four specific case studies. A new system or provider claim is not automatically proof of improved health outcomes.")+'<div class="casegrid">'+countries.map(c=>'<article class="card"><span class="eyebrow">'+esc(c.theme)+'</span><h2>'+esc(c.country)+'</h2><div class="before"><strong>BEFORE — THE PROBLEM</strong><p>'+esc(c.old)+'</p></div><div class="before"><strong>NOW — THE INTERVENTION</strong><p>'+esc(c.now)+'</p></div><div class="before"><strong>DOCUMENTED EVIDENCE & LIMITATIONS</strong><p>'+esc(c.evidence)+'</p></div><div class="before"><strong>YOUR BI METRICS</strong><p>'+esc(c.metric)+'</p></div>'+link(c.url,"Explore organization / source")+'</article>').join("")+'</div><div class="alert"><strong>Research discipline:</strong> Verify specific claims in primary implementation documents. The linked organization pages are starting points, not necessarily the documents establishing every claim.</div>'}
const months=["May","Jun","Jul","Aug","Sep","Oct"],facilities=["North Clinic","Central Clinic","River Clinic"];
const labRows=facilities.flatMap((facility,f)=>months.map((month,m)=>({facility,month,eligible:110+f*29+m*8,vaccinated:Math.round((110+f*29+m*8)*(.65+.05*f+.02*m)),received:19+((f+m)%3),expected:22})));
function csvDownload(){let csv="facility,month,eligible,vaccinated,received_reports,expected_reports\n"+labRows.map(r=>[r.facility,r.month,r.eligible,r.vaccinated,r.received,r.expected].join(",")).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="healthscope_synthetic_clinic_data.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function lab(){let rows=labRows.filter(r=>state.lab==="All facilities"||r.facility===state.lab),eligible=rows.reduce((a,r)=>a+r.eligible,0),vaccinated=rows.reduce((a,r)=>a+r.vaccinated,0);let figures=months.map(m=>{let v=rows.filter(x=>x.month===m);let e=v.reduce((a,r)=>a+r.eligible,0),n=v.reduce((a,r)=>a+r.vaccinated,0);return {month:m,value:state.metric==="coverage"?100*n/e:state.metric==="missed"?e-n:100*v.reduce((a,r)=>a+r.received,0)/v.reduce((a,r)=>a+r.expected,0)}});let max=state.metric==="missed"?Math.max(...figures.map(x=>x.value))*1.15:100;return header("Practice the analytics","Healthcare BI lab","Use fictional clinic data to understand KPIs, denominators and reporting limitations.")+'<div class="alert"><strong>Synthetic dataset:</strong> All values are invented for learning. They are not real patients, outcomes or facilities.</div><div class="cards"><div class="card"><div class="eyebrow">Eligible monthly records</div><div class="metric">'+eligible.toLocaleString()+'</div><p>Repeated monthly counts are not unique patients.</p></div><div class="card"><div class="eyebrow">Vaccinated monthly records</div><div class="metric">'+vaccinated.toLocaleString()+'</div><p>Same month and population definition.</p></div><div class="card"><div class="eyebrow">Weighted coverage</div><div class="metric">'+(100*vaccinated/eligible).toFixed(1)+'%</div><p>Total vaccinated ÷ total eligible.</p></div></div><div class="filters"><select id="labFacility"><option>All facilities</option>'+facilities.map(f=>'<option '+(f===state.lab?"selected":"")+'>'+f+'</option>').join("")+'</select><select id="labMetric"><option value="coverage" '+(state.metric==="coverage"?"selected":"")+'>Vaccination coverage (%)</option><option value="missed" '+(state.metric==="missed"?"selected":"")+'>Not yet vaccinated (records)</option><option value="reporting" '+(state.metric==="reporting"?"selected":"")+'>Report completeness (%)</option></select><button class="primary" id="downloadCsv">↓ Export practice CSV</button></div><div class="card"><h2>Monthly performance</h2><table class="table"><thead><tr><th>Month</th><th>Indicator value</th><th style="width:48%">Pattern</th></tr></thead><tbody>'+figures.map(r=>'<tr><td>'+r.month+'</td><td>'+r.value.toFixed(1)+(state.metric==="missed"?"":"%")+'</td><td><div class="bar"><span style="width:'+Math.max(0,Math.min(100,100*r.value/max))+'%"></span></div></td></tr>').join("")+'</tbody></table></div><section class="section"><div class="card"><h2>Analyst challenge</h2><p>Identify the lowest-performing month. Explain whether changes in the denominator could affect the trend. What extra data is required to attribute improvement to an intervention?</p></div></section>'}
function roadmap(){return header("Your learning journey","Four-week competence roadmap","Study the sector, practice with data, and explain evidence professionally.")+'<div class="card"><strong>'+done.length+' of 4 weeks marked complete</strong><div class="bar"><span style="width:'+done.length*25+'%"></span></div>'+steps.map(([week,task],i)=>'<label class="check"><input type="checkbox" data-week="'+i+'" '+(done.includes(i)?"checked":"")+'><span><strong>'+week+'</strong><br>'+task+'</span></label>').join("")+'</div><div class="alert">Progress saves only in this browser. It does not sync between devices.</div>'}
function sourcePage(){return header("Evidence and transparency","Sources & methods","Healthcare reports, research records and trials are different evidence types; do not treat them as interchangeable.")+'<div class="cards two">'+sources.map(([name,desc,url])=>'<div class="card"><h3>'+esc(name)+'</h3><p>'+esc(desc)+'</p>'+link(url,"Explore source")+'</div>').join("")+'</div><div class="section card"><h2>Important limitations</h2><p>This is an educational prototype. Automated topic and region classification can be imperfect. New clinical trial registration does not establish effectiveness. An official announcement is not an independent outcome evaluation. Do not use the app for individual clinical decisions.</p><p>Daily updates require the scheduled GitHub Action to run successfully. Some days may have no new posts.</p></div>'}
function render(){document.querySelector("#navigation").innerHTML=pages.map(([id,name])=>'<button class="menu '+(state.page===id?"active":"")+'" data-page="'+id+'">'+name+'</button>').join("");document.querySelector("#content").innerHTML=({overview,updates,dictionary,countries:countryView,lab,roadmap,sources:sourcePage}[state.page])();document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{state.page=b.dataset.page;state.query="";render();window.scrollTo(0,0)});document.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>{saved=saved.includes(b.dataset.save)?saved.filter(x=>x!==b.dataset.save):[...saved,b.dataset.save];localStorage.setItem("healthscope_saved",JSON.stringify(saved));render()});let search=document.querySelector("#searchNews");if(search)search.oninput=e=>{state.query=e.target.value;let pos=e.target.selectionStart;render();let next=document.querySelector("#searchNews");next.focus();next.setSelectionRange(pos,pos)};let category=document.querySelector("#category");if(category)category.onchange=e=>{state.category=e.target.value;render()};let region=document.querySelector("#region");if(region)region.onchange=e=>{state.region=e.target.value;render()};let dict=document.querySelector("#searchDict");if(dict)dict.oninput=e=>{state.dict=e.target.value;let pos=e.target.selectionStart;render();let next=document.querySelector("#searchDict");next.focus();next.setSelectionRange(pos,pos)};let group=document.querySelector("#dictGroup");if(group)group.onchange=e=>{state.group=e.target.value;render()};document.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>{document.querySelector("#quizResponse").textContent=b.dataset.answer==="1"?"Correct. Coverage requires a matching numerator and eligible population.":"Not quite. The denominator is the eligible target population for the same dose, place and period."});let lf=document.querySelector("#labFacility");if(lf)lf.onchange=e=>{state.lab=e.target.value;render()};let lm=document.querySelector("#labMetric");if(lm)lm.onchange=e=>{state.metric=e.target.value;render()};let csv=document.querySelector("#downloadCsv");if(csv)csv.onclick=csvDownload;document.querySelectorAll("[data-week]").forEach(e=>e.onchange=()=>{let i=Number(e.dataset.week);done=e.checked?[...new Set([...done,i])]:done.filter(x=>x!==i);localStorage.setItem("healthscope_done",JSON.stringify(done));render()})}
async function loadFeed(){try{const [feed,status]=await Promise.all([fetch("./data/updates.json?d="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("Feed not available");return r.json()}),fetch("./data/status.json?d="+Date.now(),{cache:"no-store"}).then(r=>r.json()).catch(()=>({}))]);if(Array.isArray(feed)&&feed.length)state.items=feed.filter(r=>r&&typeof r.url==="string"&&/^https:\/\//.test(r.url));let last=status.last_successful_refresh||status.last_attempted_refresh;document.querySelector("#freshness").textContent=last?"Last source check: "+String(last).slice(0,10):"Starter references loaded"}catch{document.querySelector("#freshness").textContent="Starter references · live feed pending"}render()}render();loadFeed();
</script></body></html>
