name: Update HealthScope daily
on:
  workflow_dispatch:
    inputs:
      force_ai_retry:
        description: "Retry one AI research brief after fixing credits or rate limits"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'docs/data/editorial_briefs.json'
      - '.github/workflows/daily-healthscope.yml'
  schedule:
    # 06:00 UTC is 07:00 West Africa Time
    - cron: '0 6 * * *'
concurrency:
  group: healthscope-daily-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check research generator and evidence tests
        run: |
          python -m py_compile scripts/research_sources.py scripts/gemini_provider.py scripts/generate_briefs.py scripts/update_feed.py
          python -m unittest discover -s tests -v
      - name: Fetch public health sources and optionally email digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
        run: python scripts/update_feed.py
      - name: Generate evidence-aware intelligence briefs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HEALTHSCOPE_AI_PROVIDER: gemini
          HEALTHSCOPE_GEMINI_MODEL: gemini-3.1-flash-lite
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HEALTHSCOPE_AI_MODEL: gpt-4.1-mini
          HEALTHSCOPE_MAX_AI: '1'
          HEALTHSCOPE_FORCE_AI_RETRY: ${{ inputs.force_ai_retry || 'false' }}
        run: python scripts/generate_briefs.py
      - name: Commit refreshed feed
        if: always()
        run: |
          git config user.name "healthscope-bot"
          git config user.email "healthscope-bot@users.noreply.github.com"
          git add docs/data/updates.json docs/data/status.json docs/data/briefs.json docs/data/brief_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh HealthScope daily healthcare sources"
            git pull --rebase origin main
            git push
          fi
